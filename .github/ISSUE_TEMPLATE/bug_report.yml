name: Bug report
description: Report a reproducible problem in Memoria.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use fictional examples and redact private meeting data. Report security vulnerabilities privately through SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit/app version, OS version, and CPU architecture.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal fictional fixture when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Remove credentials, voice profiles, and private meeting content before attaching evidence.
