name: Memoria checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoria-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and scoped meeting tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:memoria
      - run: pnpm exec vitest run src/features/meetings/meetingService.test.ts
      - run: pnpm exec vitest run src/features/temporal

  engine:
    name: Deterministic engine and product tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test journal and workspace behaviour (no model downloads)
        working-directory: src-tauri/resources/memory
        run: python -m unittest test_live_ask test_live_assistance test_temporal_service test_meetings_service test_workspace_product test_engine
